name: pmath
description: PMath — Prezident va ixtisoslashgan maktablarga tayyorlovchi math tutor.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & Clean Architecture
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  provider: ^6.1.5

  # Local storage
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Math
  google_fonts: ^6.2.1
  flutter_math_fork: ^0.7.4
  percent_indicator: ^4.2.5

  # Camera / Vision (placeholder foundation)
  camera: ^0.11.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  path: ^1.9.1
  http: ^1.6.0
  speech_to_text: ^7.4.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
